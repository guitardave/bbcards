{% extends 'base.html' %}
{% load static %}
{% block content %}
    <div class="card my-5 shadow text-center py-5">
        <div class="card-body">
            <div class="mb-3 text-danger">
                <i class="fa-solid fa-triangle-exclamation fa-4x"></i>
            </div>
            <h1 class="display-5 fw-bold mb-3">Official Review: Play Under Review</h1>
            <p class="text-muted fs-5 mb-4">An unexpected error occurred on the field. Please try again in a moment.</p>
            <a href="{% url 'cards:card-list-50' %}" class="btn btn-sport-save">
                <i class="fa-solid fa-home me-2"></i> Return to Clubhouse
            </a>
        </div>
    </div>
{% endblock %}
