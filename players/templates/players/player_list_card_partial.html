<div class="card">
    <div class="card-header bg-info-subtle">
        <div class="row align-items-center">
            <div class="col-sm-8">
                <h1><i class="fa-solid fa-baseball text-warning me-2"></i>{{ title }}</h1>
            </div>
            <div class="col-sm-4 text-end">
                <div id="message-div">
                    <small class="text-warning fade-out">
                        {{ message|safe }}
                    </small>
                </div>
            </div>
        </div>
    </div>
    <div class="card-body filter-bar">
        {% include '_search_filter.html' %}
    </div>
    <div class="card-body scroll p-0">
        <div id="player-div" class="table-responsive">
            <table class="table table-hover" id="filter-table">
                <thead>
                    <tr>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Cards Count</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="my-table">
                    {% for p in rs %}
                        <tr id="tr-p{{ p.player.id }}" class="player-row">
                            {% include 'players/player_list_tr_partial.html' %}
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    <div class="card-footer bg-info-subtle text-center">
        <span class="badge bg-secondary-subtle text-secondary-emphasis border px-3 py-1 font-athletic fs-6">Total Roster: {{ rs|length }} Players</span>
    </div>
</div>
