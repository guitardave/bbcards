[project]
name = "bbcards"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "guitardave", email = "david@onholdwizard.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asgiref==3.8.1",
    "Django==4.2.16",
    "psycopg2",
    "pytz==2021.1",
    "sqlparse==0.4.4",
    "typing-extensions==3.10.0.0",
    "dj-database-url",
    "gunicorn",
    "crispy-bootstrap4",
    "crispy-bootstrap5",
    "django-bcrypt",
    "django-bootstrap5",
    "django-cors-headers",
    "django-heroku==0.3.1",
    "django-htmx",
    "django-crispy-forms",
    "django-crispy-bootstrap",
    "django-bootstrap-breadcrumbs2",
    "django-redis",
    "django-storages",
    "djangorestframework",
    "environ",
    "boto3",
    "openpyxl",
    "xhtml2pdf",
    "requests",
    "Pillow",
    "bcrypt>=5.0.0",
]

[project.scripts]
bbcards = "bbcards:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
